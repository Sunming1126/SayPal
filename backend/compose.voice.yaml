services:
  voice:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: saypal-voice:local
    container_name: saypal-voice
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${SAYPAL_VOICE_PORT:-18030}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
