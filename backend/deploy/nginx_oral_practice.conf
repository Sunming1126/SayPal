# Include inside the HTTPS server for onesay.top.
# Only the routes used by the original oral-practice client are forwarded.
location = /saypal/oral-practice-api/guest/bootstrap {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:18031/bootstrap;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store" always;
}

location ^~ /saypal/oral-practice-api/ {
    if ($uri !~ "^/saypal/oral-practice-api/(auth/(login|logout|me|redeem_card|register)|training/(chapters(/[^/]+/(topics|units))?|topics/[^/]+/[^/]+|units/[^/]+)|define|analysis_jobs/[^/]+|sessions(/.*)?|tts/course_intro\.wav|users/[^/]+/[^/]+|voicechat/(start|end_task))$") {
        return 404;
    }
    proxy_pass http://101.43.40.114/japanese/api/;
    proxy_set_header Host 101.43.40.114;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}
