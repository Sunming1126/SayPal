# Include inside the HTTPS server for onesay.top. These routes return course
# metadata with short-lived VOD URLs. The app fetches media from VOD directly.
location ~ "^/saypal/video-origin/main/([1-9][0-9]{0,2})$" {
    limit_except GET { deny all; }
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 4s;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    proxy_pass http://101.43.40.114/japanese/api/training/topics/unit_01/$1;
}

