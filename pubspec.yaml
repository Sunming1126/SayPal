name: saypal
description: SayPal English speaking practice.
publish_to: none
version: 0.1.0+3

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  app_auth:
    path: packages/app_auth
  app_membership:
    path: packages/app_membership
  audioplayers: 6.8.1
  firebase_core: 4.14.0
  flutter_riverpod: 2.6.1
  flutter_secure_storage: 10.3.1
  go_router: 14.8.1
  http: 1.6.0
  liquid_glass_widgets: 0.24.4
  record: 6.2.1
  shared_preferences: 2.5.5
  url_launcher: 6.3.2
  video_player: 2.14.0
  volc_engine_rtc: 3.60.6

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/content/
    - assets/images/adventure/
    - assets/images/avatars/
    - assets/images/mascot/
    - assets/images/roleplay/categories/
    - assets/images/roleplay/scenarios/
    - assets/videos/scenario/
